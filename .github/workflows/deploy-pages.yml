name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'index.html'
      - 'projects/projects.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build all projects
        run: |
          mkdir -p public/previews
          for dir in projects/*/; do
            if [ -f "$dir/package.json" ]; then
              name=$(basename "$dir")
              echo "Building $name..."
              cd "$dir"
              npm install --legacy-peer-deps 2>/dev/null
              npm run build 2>/dev/null && echo "OK $name" || echo "FAIL $name"
              cd ../..
              if [ -d "$dir/out" ]; then
                cp -r "$dir/out" "public/previews/$name"
              fi
            fi
          done

      - name: Copy dashboard
        run: |
          cp index.html public/
          cp projects/projects.json public/projects.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
