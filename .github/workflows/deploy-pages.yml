name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/*/package.json

      - name: Find changed project
        id: project
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- projects/ | cut -d/ -f2 | sort -u | head -1)
          echo "name=$CHANGED" >> $GITHUB_OUTPUT
          echo "dir=projects/$CHANGED" >> $GITHUB_OUTPUT

      - name: Install & Build
        if: steps.project.outputs.name != ''
        run: |
          cd ${{ steps.project.outputs.dir }}
          npm install --legacy-peer-deps
          npm run build

      - name: Upload artifact
        if: steps.project.outputs.name != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.project.outputs.dir }}/out

      - name: Deploy to GitHub Pages
        if: steps.project.outputs.name != ''
        id: deployment
        uses: actions/deploy-pages@v4
