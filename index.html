<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAO HANDS - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#3b82f6' } } } }
  </script>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="bg-white border-b">
    <div class="max-w-5xl mx-auto px-4 py-6">
      <h1 class="text-2xl font-bold tracking-tight">FAO HANDS</h1>
      <p class="text-gray-500">Dashboard de projetos WebsiteApp</p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div id="projects" class="grid gap-4">
      <div class="text-center py-12 text-gray-400">Carregando projetos...</div>
    </div>
  </main>

  <footer class="border-t mt-12 py-6 text-center text-sm text-gray-400">
    <a href="https://github.com/faohands-head/hands-head" class="hover:underline">faohands-head/hands-head</a>
  </footer>

  <script>
    async function loadProjects() {
      try {
        const res = await fetch('projects/projects.json')
        const data = await res.json()
        const container = document.getElementById('projects')

        if (!data.projects || data.projects.length === 0) {
          container.innerHTML = '<div class="text-center py-12 text-gray-400">Nenhum projeto ainda.</div>'
          return
        }

        container.innerHTML = data.projects.map(p => `
          <a href="${p.url || '#'}" target="_blank"
             class="block bg-white rounded-xl p-6 border hover:shadow-md transition-shadow">
            <div class="flex items-start justify-between">
              <div>
                <h2 class="text-lg font-semibold">${p.name}</h2>
                <p class="text-sm text-gray-500 mt-1">${p.slug}</p>
                <div class="flex gap-2 mt-3">
                  <span class="text-xs px-2 py-1 rounded-full bg-green-100 text-green-700">${p.status}</span>
                  <span class="text-xs px-2 py-1 rounded-full bg-blue-100 text-blue-700">${p.created}</span>
                </div>
              </div>
              <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </div>
          </a>
        `).join('')
      } catch (e) {
        document.getElementById('projects').innerHTML =
          '<div class="text-center py-12 text-gray-400">Erro ao carregar projetos.</div>'
      }
    }
    loadProjects()
  </script>
</body>
</html>
